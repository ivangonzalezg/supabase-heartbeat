services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: supabase-heartbeat:local
    ports:
      - "${PORT:-7854}:${PORT:-7854}"
    environment:
      DATABASE_PATH: ${DATABASE_PATH}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:${PORT:-7854}}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      PORT: ${PORT:-7854}
      NODE_ENV: production
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD}
      FIRST_ADMIN_NAME: ${FIRST_ADMIN_NAME}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED}
    volumes:
      - heartbeat-data-dev:/repo/apps/api/data
    restart: unless-stopped

volumes:
  heartbeat-data-dev:
